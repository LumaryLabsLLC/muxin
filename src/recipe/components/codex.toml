id = "codex"
name = "Codex"
requires = ["node"]
root = true
root_unless = 'test -w "$(npm_prefix codex)"'
check = "command -v codex"
install = "npm install -g @openai/codex"
up_to_date = 'npm outdated -g --prefix "$(npm_prefix codex)" @openai/codex'
update = 'npm install -g --prefix "$(npm_prefix codex)" @openai/codex@latest'
