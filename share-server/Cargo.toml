[package]
name = "muxin-share-server"
version = "0.1.0"
edition = "2024"
description = "Introduces the two sides of a Muxin share (signaling) and serves the page that joins one from a browser"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
