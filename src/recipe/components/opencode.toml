id = "opencode"
name = "OpenCode"
requires = ["node"]
root = true
root_unless = 'test -w "$(npm_prefix opencode)"'
check = "command -v opencode"
# Its install script has to run (see claude.toml).
install = "npm install -g --allow-scripts=opencode-ai opencode-ai"
up_to_date = 'npm outdated -g --prefix "$(npm_prefix opencode)" opencode-ai'
update = 'npm install -g --allow-scripts=opencode-ai --prefix "$(npm_prefix opencode)" opencode-ai@latest'
