id = "amp"
name = "Amp"
requires = ["node"]
root = true
root_unless = 'test -w "$(npm_prefix amp)"'
check = "command -v amp"
install = "npm install -g @sourcegraph/amp"
up_to_date = 'npm outdated -g --prefix "$(npm_prefix amp)" @sourcegraph/amp'
update = 'npm install -g --prefix "$(npm_prefix amp)" @sourcegraph/amp@latest'
