"Its droplet and everything on it are deleted, and it leaves Muxin. Push your work first. It has cost about ${cost} so far." = "O droplet e tudo nele são apagados, e ela sai do Muxin. Faça push do seu trabalho antes. Custou cerca de ${cost} até agora."
