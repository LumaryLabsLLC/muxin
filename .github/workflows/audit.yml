# Advisory check on every push to main and once a week. A finding is
# reported and does not fail the workflow.
name: audit

on:
  push:
    branches: [main]
  schedule:
    # Monday 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rustsec/audit-check v2.0.0, the latest release, runs on Node 20.
      # Actions runners dropped Node 20 on 2026-09-23, and main's Node 24
      # copy has no release. Install cargo-audit instead.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
