id = "node"
name = "Node.js"
root = true
# 22 or later: Claude Code and Pi need it (Gemini CLI 20). An older Node.js,
# like the Node.js 18 of Ubuntu 24.04 and Debian 12, counts as missing, so
# installing brings Node.js 22 instead of agent CLIs that don't start.
check = 'node -e "process.exit(parseInt(process.versions.node) >= 22 ? 0 : 1)" && command -v npm'
# Debian and Ubuntu: Node.js 22 from NodeSource, as cloud machines get it.
# A Mac: Homebrew's. Elsewhere: the system's packages, as VMs get it.
install = '''
if command -v brew >/dev/null 2>&1; then
  pkg_install node
elif command -v apt-get >/dev/null 2>&1; then
  curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  pkg_install nodejs
else
  pkg_install nodejs npm
fi
'''
