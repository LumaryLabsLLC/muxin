id = "claude"
name = "Claude Code"
requires = ["node"]
root = true
# npm installs into Node.js's own folder: the user's when their Node.js is
# (mise, nvm, Homebrew), and then the step runs as the user.
root_unless = 'test -w "$(npm prefix -g)"'
check = "command -v claude"
install = "npm install -g @anthropic-ai/claude-code"
# Both look at the copy on PATH (npm_prefix), which may be outside npm's own
# folder once Node.js changed. npm outdated exits 1 when there's a newer version.
up_to_date = 'npm outdated -g --prefix "$(npm_prefix claude)" @anthropic-ai/claude-code'
update = 'npm install -g --prefix "$(npm_prefix claude)" @anthropic-ai/claude-code@latest'
