[package]
name = "muxen"
version = "0.5.0"
edition = "2024"
description = "All your machines, one app. For you and your AI agents."
license = "Apache-2.0"
publish = false
repository = "https://github.com/LumaryLabsLLC/muxin"
readme = "README.md"
keywords = ["github-actions", "self-hosted", "runners", "ci", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
gpui = { version = "0.2.2", optional = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
unicode-segmentation = { version = "1", optional = true }
# Terminal emulation for embedded agent sessions (Apache-2.0).
alacritty_terminal = { version = "0.26", optional = true }
# The desktop view: JPEG frames from machines' agents (both already in GPUI's tree).
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
smallvec = { version = "1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Direct connections to machines' agents: QUIC with mutually pinned certificates.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# Bigger UDP buffers for those connections (macOS's defaults choke a copy).
socket2 = "0.6"
mdns-sd = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
# Already part of GPUI's dependency tree; used to set the Dock icon when running
# the bare binary (an .app bundle gets it from its Info.plist instead).
cocoa = { version = "=0.26.0", optional = true }
# Also already in GPUI's tree: to start a native window drag from our own title bar.
objc = { version = "0.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Already in the tree (through reqwest/native roots): the Keychain, for cloud sign-ins.
security-framework = "3"

# The icon and name in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Starting without a console window (see main.rs `without_console_window`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials", "Win32_Graphics_Dwm"] }
# The window's handle, to color its title bar like the theme.
raw-window-handle = { version = "0.6", optional = true }

[workspace]
members = [".", "agent"]

[features]
default = ["gui"]
# The native window. Build with `--no-default-features` for a headless CLI + MCP
# server that needs no GUI libraries (Linux servers, CI, agent boxes).
gui = ["dep:gpui", "dep:unicode-segmentation", "dep:cocoa", "dep:objc", "dep:raw-window-handle", "dep:alacritty_terminal", "dep:image", "dep:smallvec"]

[profile.release]
lto = "thin"
strip = true
