[package]
name = "muxen-agent"
version = "0.2.7"
edition = "2024"
description = "Runs on each machine Muxen manages: keeps agent sessions alive and lets the app attach to them"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
serde_json = "1"
# Direct connections (`listen`): QUIC with mutually pinned certificates.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }

# The desktop view (`screen`): X11 capture and input on Linux, JPEG frames.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "shm", "xfixes"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
jpeg-encoder = "0.6"

[build-dependencies]
cc = "1"
