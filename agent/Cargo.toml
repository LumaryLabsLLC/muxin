[package]
name = "muxen-agent"
version = "0.2.9"
edition = "2024"
description = "Runs on each machine Muxen manages: keeps agent sessions alive and lets the app attach to them"
license = "Apache-2.0"
publish = false

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
libc = "0.2"
portable-pty = "0.9"
serde_json = "1"
# Direct connections (`listen`): QUIC with mutually pinned certificates.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }

# The desktop view (`screen`): X11 capture and input on Linux, JPEG frames.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "shm", "xfixes", "randr"] }

# The console in raw mode for `attach`, on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_RemoteDesktop",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
jpeg-encoder = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
jpeg-encoder = "0.6"

[build-dependencies]
cc = "1"
